<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add pharmacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Neuton:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="nav-bar">
    <a class="nav-back" href="request-pharmacy.html" aria-label="Back">&#8249;</a>
    <span class="nav-title">Add pharmacy</span>
  </div>

  <div class="content">
    <h2 class="section-title" style="font-size:20px;">Search pharmacies</h2>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search name, address, or ZIP" autocomplete="off">
      <button class="search-submit" id="search-btn" aria-label="Search"><img src="assets/search-icon.svg" alt=""></button>
    </div>

    <div class="chip-row" id="chip-row" style="display:none;">
      <button class="chip is-active" data-filter="all">All</button>
      <button class="chip" data-filter="retail">Retail</button>
      <button class="chip" data-filter="mail">Mail-order</button>
    </div>

    <div id="results"></div>

    <div class="manual-add" id="manual-add" style="display:none;">
      <p>Can&rsquo;t find your pharmacy?</p>
      <p>Check your spelling or add it manually.</p>
      <a href="add-pharmacy-manual.html" id="add-manually-link">Add Manually</a>
    </div>
  </div>

  <div class="sticky-footer">
    <button class="btn btn-primary is-disabled" id="save-btn" type="button">Save</button>
  </div>
</div>

<script src="state.js"></script>
<script src="mock-data.js"></script>
<script>
  const state = loadState();
  let currentResults = { retail: [], mail: [], zip: '84020' };
  let activeFilter = 'all';
  let selectedResultId = null;

  const input = document.getElementById('search-input');
  const resultsEl = document.getElementById('results');
  const chipRow = document.getElementById('chip-row');
  const manualAdd = document.getElementById('manual-add');
  const saveBtn = document.getElementById('save-btn');

  function runSearch() {
    const query = input.value.trim();
    selectedResultId = null;
    updateSaveButton();

    if (!query) {
      currentResults = { retail: [], mail: [], zip: '84020' };
      chipRow.style.display = 'none';
      manualAdd.style.display = 'none';
      resultsEl.innerHTML = '<p class="search-empty">Search by pharmacy name, address, or ZIP to see local retail and mail-order options.</p>';
      return;
    }

    currentResults = searchPharmacies(query);
    chipRow.style.display = 'flex';
    manualAdd.style.display = 'block';
    renderResults();
  }

  function renderResults() {
    const showRetail = activeFilter === 'all' || activeFilter === 'retail';
    const showMail = activeFilter === 'all' || activeFilter === 'mail';
    let html = '';

    if (showRetail && currentResults.retail.length) {
      html += `<p class="results-heading">Results near ${currentResults.zip}</p>`;
      html += `<div class="pharmacy-list">${currentResults.retail.map(renderResultItem).join('')}</div>`;
    }
    if (showMail && currentResults.mail.length) {
      html += `<p class="results-heading section-gap">Mail-order</p>`;
      html += `<div class="pharmacy-list">${currentResults.mail.map(renderResultItem).join('')}</div>`;
    }
    if (!html) {
      html = '<p class="search-empty">No results in this category. Try &ldquo;All&rdquo; or a different search.</p>';
    }
    resultsEl.innerHTML = html;

    resultsEl.querySelectorAll('.pharmacy-item').forEach(item => {
      item.addEventListener('click', () => {
        selectedResultId = item.dataset.id;
        renderResults();
        updateSaveButton();
      });
    });
  }

  function renderResultItem(ph) {
    const selected = selectedResultId === ph.id;
    return `
      <div class="pharmacy-item ${selected ? 'is-selected' : ''}" data-id="${ph.id}">
        <div class="pharmacy-row">
          <span class="radio ${selected ? 'is-selected' : ''}"></span>
          <div style="flex:1">
            <p class="pharmacy-name">${ph.name}</p>
            <p class="pharmacy-address">${ph.address}<br>${ph.city}</p>
            <p class="pharmacy-phone">${ph.phone}</p>
          </div>
        </div>
      </div>`;
  }

  function updateSaveButton() {
    if (selectedResultId) saveBtn.classList.remove('is-disabled');
    else saveBtn.classList.add('is-disabled');
  }

  function currentSelectedPharmacy() {
    return [...currentResults.retail, ...currentResults.mail].find(p => p.id === selectedResultId) || null;
  }

  document.getElementById('search-btn').addEventListener('click', runSearch);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

  chipRow.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    activeFilter = chip.dataset.filter;
    chipRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('is-active', c === chip));
    renderResults();
  });

  saveBtn.addEventListener('click', () => {
    const ph = currentSelectedPharmacy();
    if (!ph) return;
    // Add to saved list (top of list) and select it, then head back.
    state.savedPharmacies = [ph, ...state.savedPharmacies.filter(p => p.id !== ph.id)];
    state.selectedPharmacyId = ph.id;
    saveState(state);
    window.location.href = 'request-pharmacy.html';
  });

  // Initial empty state
  resultsEl.innerHTML = '<p class="search-empty">Search by pharmacy name, address, or ZIP to see local retail and mail-order options.</p>';
</script>
</body>
</html>
