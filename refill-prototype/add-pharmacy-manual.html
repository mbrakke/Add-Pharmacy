<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Pharmacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Neuton:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="nav-bar">
    <a class="nav-back" href="add-pharmacy.html" aria-label="Back">&#8249;</a>
    <span class="nav-title">Add Pharmacy</span>
  </div>

  <div class="content">
    <h1 class="page-title" style="font-size:20px; font-family:var(--font-body); font-weight:var(--font-weight-bold);">Add pharmacy manually</h1>
    <p class="page-subtitle">Enter the details below. Your care team will verify this pharmacy before your prescription is sent.</p>

    <div class="form-field">
      <label class="form-label" for="m-name">Name</label>
      <input class="form-input" type="text" id="m-name" placeholder="e.g. Walgreens">
    </div>
    <div class="form-field">
      <label class="form-label" for="m-address">Address</label>
      <input class="form-input" type="text" id="m-address" placeholder="e.g. 123 Happy Street">
    </div>
    <div class="form-field">
      <label class="form-label" for="m-zip">ZIP</label>
      <input class="form-input" type="text" id="m-zip" placeholder="e.g. 84020" inputmode="numeric">
    </div>
    <div class="form-field">
      <label class="form-label" for="m-city">City</label>
      <input class="form-input" type="text" id="m-city" placeholder="e.g. Draper">
    </div>
    <div class="form-field">
      <label class="form-label" for="m-state">State</label>
      <div class="form-select-wrap">
        <select class="form-select" id="m-state">
          <option value="">Select state</option>
          <option>Alabama</option><option>Alaska</option><option>Arizona</option><option>Arkansas</option>
          <option>California</option><option>Colorado</option><option>Connecticut</option><option>Delaware</option>
          <option>Florida</option><option>Georgia</option><option>Hawaii</option><option>Idaho</option>
          <option>Illinois</option><option>Indiana</option><option>Iowa</option><option>Kansas</option>
          <option>Kentucky</option><option>Louisiana</option><option>Maine</option><option>Maryland</option>
          <option>Massachusetts</option><option>Michigan</option><option>Minnesota</option><option>Mississippi</option>
          <option>Missouri</option><option>Montana</option><option>Nebraska</option><option>Nevada</option>
          <option>New Hampshire</option><option>New Jersey</option><option>New Mexico</option><option>New York</option>
          <option>North Carolina</option><option>North Dakota</option><option>Ohio</option><option>Oklahoma</option>
          <option>Oregon</option><option>Pennsylvania</option><option>Rhode Island</option><option>South Carolina</option>
          <option>South Dakota</option><option>Tennessee</option><option>Texas</option><option selected>Utah</option>
          <option>Vermont</option><option>Virginia</option><option>Washington</option><option>West Virginia</option>
          <option>Wisconsin</option><option>Wyoming</option>
        </select>
      </div>
    </div>
    <div class="form-field">
      <label class="form-label" for="m-phone">Phone number</label>
      <input class="form-input" type="tel" id="m-phone" placeholder="(801) 123-4567">
    </div>

    <div class="form-checkbox-row">
      <input type="checkbox" id="m-mail-order">
      <label for="m-mail-order">My pharmacy is online/mail-order</label>
    </div>
  </div>

  <div class="sticky-footer">
    <button class="btn btn-primary is-disabled" id="manual-save-btn" type="button">Save</button>
  </div>
</div>

<script src="state.js"></script>
<script>
  const state = loadState();
  const nameInput = document.getElementById('m-name');
  const saveBtn = document.getElementById('manual-save-btn');

  function updateSaveState() {
    saveBtn.classList.toggle('is-disabled', !nameInput.value.trim());
  }
  nameInput.addEventListener('input', updateSaveState);

  saveBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) return;

    const address = document.getElementById('m-address').value.trim();
    const zip = document.getElementById('m-zip').value.trim();
    const city = document.getElementById('m-city').value.trim();
    const stateVal = document.getElementById('m-state').value;
    const phone = document.getElementById('m-phone').value.trim();
    const isMailOrder = document.getElementById('m-mail-order').checked;

    const cityLine = [city, stateVal].filter(Boolean).join(', ') + (zip ? ' ' + zip : '');

    const newPharmacy = {
      id: 'manual-' + Date.now(),
      name: name,
      address: address || 'Address not provided',
      city: cityLine || 'City not provided',
      phone: phone || 'Phone not provided',
      type: isMailOrder ? 'mail' : 'retail'
    };

    state.savedPharmacies = [newPharmacy, ...state.savedPharmacies];
    state.selectedPharmacyId = newPharmacy.id;
    saveState(state);
    window.location.href = 'request-pharmacy.html';
  });
</script>
</body>
</html>
